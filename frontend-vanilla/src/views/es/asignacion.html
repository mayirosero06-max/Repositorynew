<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación | Gestion de ambientes putumayo</title>
    <link rel="stylesheet" href="../../estilos/variables.css">
    <link rel="stylesheet" href="../../estilos/base.css">
    <link rel="stylesheet" href="../../estilos/componentes.css">
    <link rel="stylesheet" href="../../estilos/layout.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap">
</head>

<body> 
     <a class="Saltar" href="#contenido">Saltar al contenido</a>
   <header class="encabezado"> 
    <p class="marca"><a href="../index.html">Gestion de <span> ambientes e instructores</span></a></p>
    <nav aria-label="Menú principal">
        <ul class="menu">
            <li><a href="../index.html" aria-current="page">inicio</a></li>
            <li><a href="consulta-cursos.html" aria-label="Cursos">Cursos</a></li>
            <li><a href="disponibilidad.html" aria-label="Disponibilidad">Disponibilidad</a></li>
            <li><a href="municipios.html" aria-label="Municipios">Municipio</a></li>
            <li><a href="asignacion.html" aria-label="Asignacion">Asignacion</a></li>
          
        </ul>
    </nav>
   </header>
   <main id="contenido" class="contenido">
    <h1>Asignación de ambientes e instructores</h1>
        <form class="tarjeta_formulario" id="form_asignacion" action="#" method="post" novalidate>
                <fieldset>
                 <legend>Curso y ubicación</legend>
                 <p class="campo">
                 <label for="Ficha">Ficha</label>
                 <select id="Ficha" name="Ficha" required aria-describedby="error-Ficha">
                    <option value="">--</option>
                    <option value="100001">100001 Análisis y Desarrollo de Software</option>
                    <option value="100002">100002 cocina</option>
                    <option value="100003">100003 tecnologo en conduccion vial</option>
                 </select>
                 <span class="error-ficha" id="error-Ficha"></span>
                </p>
            
                <p class="campo">
                 <label for="Municipio">Municipio</label>
                 <select id="municipio" name="municipio" required  aria-describedby="error-municipio">
                     <option value="">--</option>
                     <option value="Puerto Asis">Puerto Asis</option>
                     <option value="Mocoa">Mocoa</option>
                     <option value="Orito">Orito</option>
                     <option value="puerto-caicedo">Puerto Caicedo</option>
                 </select>
                 <span class="error-municipio" id="error-municipio"></ span>
                </p>

                <p class="campo">
                 <label for="Sede">sede</label>
                 <select id="sede" name="sede" required  aria-describedby="error-sede">
                    <option value="">--</option>
                    <option value="CAAA - 1">CAAA - 1</option>
                    <option value="CAAA - 2">CAAA - 2</option>
                    <option value="CAAA - 3">CAAA - 3</option>
                 </select>
                 <span class="error-sede" id="error-sede"></span>
                </p>

                <p class="campo">
                 <label for="Aula">Aula</label>
                 <select id="aula" name="aula" required aria-describedby="error-ambiente">
                     <option value="">--</option>
                     <option value="101">101</option>
                     <option value="102">102</option>
                     <option value="103">103</option>
                 </select>
                 <span class="error-ambiente" id="error-ambiente"></ span>
                </p>
            </fieldset> 
            <fieldset>
                <legend>Instructor y horaio</legend>   
                <p class="campo">
                 <label for="Instructor">Instructor</label>
                 <select name="instructor" id="instructor" required  aria-describedby="error-instructor">
                    <option value="">--</option>
                    <option value="Instructor 1">Instructor 1</option>
                    <option value="Instructor 2">Instructor 2</option>
                    <option value="Instructor 3">Instructor 3</option>
                    <option value="Instructor 4">Instructor 4</option>
                 </select>
                 <span class="error-instructor" id="error-instructor"></span>
                </p>  

                <p class="campo">
                    <label for="dia">Día</label>
                    <select name="dia" id="dia" required aria-describedby="error-dia">
                        <option value="">--</option>
                        <option value="1">Lunes</option>
                        <option value="2">Martes</option>
                        <option value="3">Miércoles</option>
                        <option value="4">Jueves</option>
                        <option value="5">Viernes</option>
                    </select>
                    <span class="error-dia" id="error-dia"></span>
                </p>

                <p class="campo">
                    <label for="inicio">Hora Inicio</label>
                    <input type="time" min="06:00" max="24:00"     name="inicio" id="inicio" step="1800" required
                     aria-describedby="error-inicio">
                    <span class="error-inicio" id="error-inicio"></span>
                </p>
                <p class="campo">
                <label for="fin">Hora fin</label>
                <input type="time" id="fin" name="fin" min="6:00" max="24:00" step="1800" required aria-describedby="error-fin"> <span class="error-fin" id="error-fin"></span>
            </fieldset>
            </p>
            <p class="acciones">
             <button type="reset" class="btn-secundario">Limpiar</button>
            <button type="submit" class="btn-primario">Guardar asignación</button>
            </p>
        </form>
   </main>
   <aside></aside>
   <footer class="pie">
    <p>Centro Agroforestal y Acuicola Arapaima - SENA Regional Putumayo</p>
   </footer>
    
</body>
</html>
